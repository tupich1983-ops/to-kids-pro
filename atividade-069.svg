<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-label="Esquema de três etapas da atividade Passar fita por furos"><rect width="960" height="370" rx="16" fill="white"/><g font-family="Arial" fill="#344d50"><text x="20" y="37" font-size="22" font-weight="bold" fill="#164b4c">Passar fita por furos</text><text x="20" y="66" font-size="14">Coordenação bilateral • Esquema de orientação, não demonstração anatômica</text><rect x="20" y="92" width="290" height="255" rx="16" fill="#e9f3f3"/><text x="38" y="123" font-size="16" font-weight="bold" fill="#164b4c">1 • ORGANIZAR</text><line x1="38" y1="138" x2="292" y2="138" stroke="#9cb5b4"/><text x="38" y="170" font-size="14">Materiais: Cartão perfurado e fita</text><text x="38" y="190" font-size="14">larga.</text><rect x="330" y="92" width="290" height="255" rx="16" fill="#e9eff9"/><text x="348" y="123" font-size="16" font-weight="bold" fill="#164b4c">2 • FAZER</text><line x1="348" y1="138" x2="602" y2="138" stroke="#9cb5b4"/><text x="348" y="170" font-size="14">Estabilizar cartão e passar fita em</text><text x="348" y="190" font-size="14">furos grandes</text><rect x="640" y="92" width="290" height="255" rx="16" fill="#fff1e6"/><text x="658" y="123" font-size="16" font-weight="bold" fill="#164b4c">3 • REGISTRAR</text><line x1="658" y1="138" x2="912" y2="138" stroke="#9cb5b4"/><text x="658" y="170" font-size="14">Observar: Completa dois furos.</text></g></svg>