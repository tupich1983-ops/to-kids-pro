<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Esquema em três etapas da atividade Brincar com água em recipiente"><rect width="940" height="330" rx="20" fill="#fff"/><text x="22" y="41" font-family="Arial" font-size="23" font-weight="bold" fill="#164b4c">Brincar com água em recipiente</text><text x="22" y="64" font-family="Arial" font-size="13" fill="#5b7473">Sequência esquemática específica da atividade • não é fotografia nem demonstração de técnica</text><g font-family="Arial"><rect x="20" y="80" width="280" height="225" rx="16" fill="#e7f4f0"/><text x="38" y="109" font-size="15" font-weight="bold" fill="#1a5656">1. PREPARAR</text><circle cx="160" cy="151" r="31" fill="#fff"/><text x="160" y="165" font-size="37" text-anchor="middle" fill="#2a7775">◇</text><text x="38" y="210" font-size="14" fill="#314b51">Use recipiente raso sobre superfície</text><text x="38" y="230" font-size="14" fill="#314b51">estável, com supervisão contínua.</text><rect x="320" y="80" width="280" height="225" rx="16" fill="#e6eefb"/><text x="338" y="109" font-size="15" font-weight="bold" fill="#1a5656">2. EXPERIMENTAR</text><circle cx="460" cy="151" r="31" fill="#fff"/><text x="460" y="165" font-size="37" text-anchor="middle" fill="#2a7775">≈</text><text x="338" y="210" font-size="14" fill="#314b51">Demonstre transferir água com copo</text><text x="338" y="230" font-size="14" fill="#314b51">grande ou colher.</text><rect x="620" y="80" width="280" height="225" rx="16" fill="#fff0e3"/><text x="638" y="109" font-size="15" font-weight="bold" fill="#1a5656">3. OBSERVAR</text><circle cx="760" cy="151" r="31" fill="#fff"/><text x="760" y="165" font-size="37" text-anchor="middle" fill="#2a7775">✓</text><text x="638" y="210" font-size="14" fill="#314b51">Ofereça alternativa seca ou</text><text x="638" y="230" font-size="14" fill="#314b51">ferramenta para evitar molhar as</text><text x="638" y="250" font-size="14" fill="#314b51">mãos.</text></g></svg>